<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface-hover: #24242e;
      --border: #2e2e3a;
      --text: #f0f0f5;
      --text-muted: #8b8b9e;
      --primary: #7c6cff;
      --primary-hover: #6a59f5;
      --danger: #ff5c7a;
      --success: #3dd68c;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      background-image:
        radial-gradient(ellipse at top, rgba(124, 108, 255, 0.12), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(61, 214, 140, 0.06), transparent 40%);
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.2);
    }

    #todo-input::placeholder {
      color: var(--text-muted);
    }

    #add-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #add-btn:hover {
      background: var(--primary-hover);
    }

    #add-btn:active {
      transform: scale(0.97);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      min-height: 60px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: background 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover {
      background: var(--surface-hover);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      background: transparent;
    }

    .checkbox:hover {
      border-color: var(--primary);
    }

    .todo-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .todo-item.completed .checkbox svg {
      opacity: 1;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      outline: none;
    }

    .todo-text[contenteditable="true"] {
      background: rgba(124, 108, 255, 0.1);
      border-radius: 6px;
      padding: 2px 6px;
      margin: -2px -6px;
    }

    .actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .todo-item:hover .actions {
      opacity: 1;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .action-btn.edit:hover {
      color: var(--primary);
    }

    .action-btn.delete:hover {
      color: var(--danger);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.8rem; }
      .todo-form { flex-direction: column; }
      #add-btn { padding: 14px; }
      .actions { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>✨ Todo List</h1>
      <p class="subtitle">Built with AI • Stage 1</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed" class="clear-btn">Clear completed</button>
    </footer>
  </div>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const itemsLeft = document.getElementById('items-left');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let currentFilter = 'all';

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function render() {
      list.innerHTML = '';

      let filtered = todos;
      if (currentFilter === 'active') {
        filtered = todos.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = todos.filter(t => t.completed);
      }

      if (filtered.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent =
          currentFilter === 'completed'
            ? 'No completed tasks yet'
            : currentFilter === 'active'
            ? 'No active tasks — add one above!'
            : 'Your todo list is empty. Add something!';
        list.appendChild(empty);
      } else {
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          li.dataset.id = todo.id;

          li.innerHTML = `
            <div class="checkbox" data-action="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="todo-text" contenteditable="false">${escapeHtml(todo.text)}</span>
            <div class="actions">
              <button class="action-btn edit" data-action="edit" title="Edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
              <button class="action-btn delete" data-action="delete" title="Delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;
          list.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      todos.unshift({
        id: generateId(),
        text,
        completed: false,
        createdAt: Date.now()
      });

      input.value = '';
      saveTodos();
      render();
      input.focus();
    });

    list.addEventListener('click', e => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const li = actionEl.closest('.todo-item');
      if (!li) return;

      const id = li.dataset.id;
      const action = actionEl.dataset.action;

      if (action === 'toggle') {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        }
      }

      if (action === 'delete') {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        render();
      }

      if (action === 'edit') {
        const textEl = li.querySelector('.todo-text');
        textEl.contentEditable = 'true';
        textEl.focus();

        const range = document.createRange();
        range.selectNodeContents(textEl);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);

        const saveEdit = () => {
          const newText = textEl.textContent.trim();
          if (newText) {
            const todo = todos.find(t => t.id === id);
            if (todo) todo.text = newText;
          }
          textEl.contentEditable = 'false';
          saveTodos();
          render();
        };

        textEl.addEventListener('blur', saveEdit, { once: true });
        textEl.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            textEl.blur();
          }
          if (ev.key === 'Escape') {
            textEl.contentEditable = 'false';
            render();
          }
        });
      }
    });

    clearCompletedBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
